name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes

  build:
    needs: release
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64, name: spec-linux-amd64 }
          - { goos: linux, goarch: arm64, name: spec-linux-arm64 }
          - { goos: darwin, goarch: amd64, name: spec-darwin-amd64 }
          - { goos: darwin, goarch: arm64, name: spec-darwin-arm64 }
          - { goos: windows, goarch: amd64, name: spec-windows-amd64.exe }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Verify tag matches VERSION
        run: test "v$(cat VERSION)" = "$GITHUB_REF_NAME"
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: >
          go build -trimpath
          -ldflags "-s -w -X main.version=${GITHUB_REF_NAME#v}"
          -o ${{ matrix.name }} .
      - name: Stage artifact
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.name }}
          path: ${{ matrix.name }}
      - name: Upload release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" "${{ matrix.name }}" --clobber

  checksums:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          merge-multiple: true
      - name: Generate checksums
        run: sha256sum spec-* > checksums.txt && cat checksums.txt
      - name: Upload checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" checksums.txt --clobber
