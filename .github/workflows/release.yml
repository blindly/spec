name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes

  build:
    needs: release
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64, name: spec-linux-amd64 }
          - { goos: linux, goarch: arm64, name: spec-linux-arm64 }
          - { goos: darwin, goarch: amd64, name: spec-darwin-amd64 }
          - { goos: darwin, goarch: arm64, name: spec-darwin-arm64 }
          - { goos: windows, goarch: amd64, name: spec-windows-amd64.exe }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-s -w" -o ${{ matrix.name }} .
      - name: Upload release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" "${{ matrix.name }}" --clobber
